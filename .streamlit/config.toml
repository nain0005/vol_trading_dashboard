# Matches app/colors.py so the chrome (buttons, tabs, metrics) doesn't clash
# with the Plotly charts, which pull their palette from that same file.
[theme]
base = "dark"
primaryColor = "#4c9aff"
backgroundColor = "#0d1117"
secondaryBackgroundColor = "#161b22"
textColor = "#e8eaed"
font = "sans serif"
